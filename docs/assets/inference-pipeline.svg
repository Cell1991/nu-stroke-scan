<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-pipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0A1227" />
      <stop offset="100%" stop-color="#070C18" />
    </linearGradient>

    <!-- Step Box Gradients -->
    <linearGradient id="step-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F213A" />
      <stop offset="100%" stop-color="#0A1628" />
    </linearGradient>
    <linearGradient id="step-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2C38" />
      <stop offset="100%" stop-color="#071D26" />
    </linearGradient>
    <linearGradient id="step-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C2F2D" />
      <stop offset="100%" stop-color="#08201F" />
    </linearGradient>
    <linearGradient id="step-grad-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1838" />
      <stop offset="100%" stop-color="#100F26" />
    </linearGradient>
    <linearGradient id="step-grad-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08332A" />
      <stop offset="100%" stop-color="#05241D" />
    </linearGradient>

    <!-- Filters -->
    <filter id="pipe-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes flowDash {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
      .pipe-arrow {
        stroke-dasharray: 4 3;
        animation: flowDash 1.2s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="1100" height="320" rx="16" fill="url(#bg-grad-pipe)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Section Title -->
  <g transform="translate(40, 30)">
    <rect width="190" height="22" rx="11" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-width="0.8" />
    <text x="95" y="15" text-anchor="middle" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1">END-TO-END WORKFLOW</text>
    <text x="0" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3">
      Clinical Image Processing &amp; Inference Pipeline
    </text>
  </g>

  <!-- 5 PIPELINE STAGES (Horizontal Sequence) -->

  <!-- STEP 1: INGESTION -->
  <g transform="translate(40, 95)" filter="url(#pipe-shadow)">
    <rect width="180" height="190" rx="10" fill="url(#step-grad-1)" stroke="#0284C7" stroke-width="1.2" />
    
    <!-- Badge Step -->
    <rect x="14" y="14" width="30" height="20" rx="4" fill="#0284C7" />
    <text x="29" y="28" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="800">01</text>
    
    <text x="14" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">NCCT Ingestion</text>
    <text x="14" y="74" fill="#64748B" font-family="sans-serif" font-size="10.5">Axial Brain Slices</text>

    <!-- Details Box -->
    <rect x="14" y="88" width="152" height="88" rx="6" fill="#061120" stroke="#1E3A8A" stroke-width="0.6" />
    <text x="22" y="108" fill="#CBD5E1" font-family="sans-serif" font-size="10">• PNG / JPG / DICOM</text>
    <text x="22" y="126" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Multipart Form API</text>
    <text x="22" y="144" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Client Image Buffer</text>
    <text x="22" y="162" fill="#38BDF8" font-family="sans-serif" font-size="9.5" font-weight="600">Max File Size: 25MB</text>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <line x1="220" y1="190" x2="250" y2="190" stroke="#0284C7" stroke-width="2" class="pipe-arrow" />

  <!-- STEP 2: GUARDRAIL -->
  <g transform="translate(250, 95)" filter="url(#pipe-shadow)">
    <rect width="180" height="190" rx="10" fill="url(#step-grad-2)" stroke="#06B6D4" stroke-width="1.2" />
    
    <!-- Badge Step -->
    <rect x="14" y="14" width="30" height="20" rx="4" fill="#06B6D4" />
    <text x="29" y="28" text-anchor="middle" fill="#082F49" font-family="monospace" font-size="10" font-weight="800">02</text>
    
    <text x="14" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Brain Guardrail</text>
    <text x="14" y="74" fill="#64748B" font-family="sans-serif" font-size="10.5">Pre-Inference Check</text>

    <!-- Details Box -->
    <rect x="14" y="88" width="152" height="88" rx="6" fill="#04151D" stroke="#0E7490" stroke-width="0.6" />
    <text x="22" y="108" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Grayscale Check</text>
    <text x="22" y="126" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Skull Contour Ratio</text>
    <text x="22" y="144" fill="#CBD5E1" font-family="sans-serif" font-size="10">• HU Distribution</text>
    <text x="22" y="162" fill="#22D3EE" font-family="sans-serif" font-size="9.5" font-weight="600">Rejects Non-CT Imgs</text>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <line x1="430" y1="190" x2="460" y2="190" stroke="#06B6D4" stroke-width="2" class="pipe-arrow" />

  <!-- STEP 3: PREPROCESSING -->
  <g transform="translate(460, 95)" filter="url(#pipe-shadow)">
    <rect width="180" height="190" rx="10" fill="url(#step-grad-3)" stroke="#0D9488" stroke-width="1.2" />
    
    <!-- Badge Step -->
    <rect x="14" y="14" width="30" height="20" rx="4" fill="#0D9488" />
    <text x="29" y="28" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="800">03</text>
    
    <text x="14" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Tensor Prep</text>
    <text x="14" y="74" fill="#64748B" font-family="sans-serif" font-size="10.5">Standardization</text>

    <!-- Details Box -->
    <rect x="14" y="88" width="152" height="88" rx="6" fill="#051B19" stroke="#115E59" stroke-width="0.6" />
    <text x="22" y="108" fill="#CBD5E1" font-family="sans-serif" font-size="10">• 224 × 224 Resizing</text>
    <text x="22" y="126" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Zero-Center Norm</text>
    <text x="22" y="144" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Brain Windowing</text>
    <text x="22" y="162" fill="#2DD4BF" font-family="sans-serif" font-size="9.5" font-weight="600">Batch [1, 1, 224, 224]</text>
  </g>

  <!-- CONNECTOR 3 -> 4 -->
  <line x1="640" y1="190" x2="670" y2="190" stroke="#0D9488" stroke-width="2" class="pipe-arrow" />

  <!-- STEP 4: MODEL INFERENCE -->
  <g transform="translate(670, 95)" filter="url(#pipe-shadow)">
    <rect width="180" height="190" rx="10" fill="url(#step-grad-4)" stroke="#6366F1" stroke-width="1.2" />
    
    <!-- Badge Step -->
    <rect x="14" y="14" width="30" height="20" rx="4" fill="#6366F1" />
    <text x="29" y="28" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="800">04</text>
    
    <text x="14" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Model Execution</text>
    <text x="14" y="74" fill="#64748B" font-family="sans-serif" font-size="10.5">SOTA AI Network</text>

    <!-- Details Box -->
    <rect x="14" y="88" width="152" height="88" rx="6" fill="#0C0D24" stroke="#3730A3" stroke-width="0.6" />
    <text x="22" y="108" fill="#CBD5E1" font-family="sans-serif" font-size="10">• VCA-Net Forward</text>
    <text x="22" y="126" fill="#CBD5E1" font-family="sans-serif" font-size="10">• DLKA Attention</text>
    <text x="22" y="144" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Patcher mmseg API</text>
    <text x="22" y="162" fill="#818CF8" font-family="sans-serif" font-size="9.5" font-weight="600">Sigmoid Logits Output</text>
  </g>

  <!-- CONNECTOR 4 -> 5 -->
  <line x1="850" y1="190" x2="880" y2="190" stroke="#6366F1" stroke-width="2" class="pipe-arrow" />

  <!-- STEP 5: CLINICAL UI PRESENTATION -->
  <g transform="translate(880, 95)" filter="url(#pipe-shadow)">
    <rect width="180" height="190" rx="10" fill="url(#step-grad-5)" stroke="#10B981" stroke-width="1.4" />
    
    <!-- Badge Step -->
    <rect x="14" y="14" width="30" height="20" rx="4" fill="#10B981" />
    <text x="29" y="28" text-anchor="middle" fill="#064E3B" font-family="monospace" font-size="10" font-weight="800">05</text>
    
    <text x="14" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Clinical Display</text>
    <text x="14" y="74" fill="#34D399" font-family="sans-serif" font-size="10.5">Real-Time Decision</text>

    <!-- Details Box -->
    <rect x="14" y="88" width="152" height="88" rx="6" fill="#041F1A" stroke="#047857" stroke-width="0.6" />
    <text x="22" y="108" fill="#CBD5E1" font-family="sans-serif" font-size="10">• 2.5× Diagnostic Loupe</text>
    <text x="22" y="126" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Synced Pan &amp; Zoom</text>
    <text x="22" y="144" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Live Thresholding</text>
    <text x="22" y="162" fill="#34D399" font-family="sans-serif" font-size="9.5" font-weight="600">Export &amp; Area Metric</text>
  </g>
</svg>
