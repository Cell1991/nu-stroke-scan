<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="bg-grad-models" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#090E1B" />
    </linearGradient>

    <linearGradient id="card-vca" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1E38" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <linearGradient id="card-dlka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09282D" />
      <stop offset="100%" stop-color="#07191E" />
    </linearGradient>

    <linearGradient id="card-patcher" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1838" />
      <stop offset="100%" stop-color="#100F26" />
    </linearGradient>

    <linearGradient id="card-maxvit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1A10" />
      <stop offset="100%" stop-color="#1A0F0A" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-vca">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
    <filter id="glow-dlka">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2DD4BF" flood-opacity="0.3" />
    </filter>
    <filter id="glow-patcher">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#818CF8" flood-opacity="0.3" />
    </filter>
    <filter id="glow-maxvit">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>

    <style>
      @keyframes dashFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .flow-path {
        stroke-dasharray: 6 4;
        animation: dashFlow 1.8s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad-models)" stroke="#1E293B" stroke-width="1.2" />

  <!-- SECTION HEADER -->
  <g transform="translate(40, 32)">
    <rect width="210" height="22" rx="11" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="0.8" />
    <text x="105" y="15" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">DEEP LEARNING SUITE</text>
    <text x="0" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3">
      Segmentation &amp; Multiclass Disease Classification Engine
    </text>
  </g>

  <!-- INPUT HUB (Left) -->
  <g transform="translate(40, 95)">
    <rect width="160" height="275" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2" filter="url(#shadow-card)" />
    
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#1E293B" />
    <circle cx="36" cy="36" r="12" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <ellipse cx="36" cy="36" rx="8" ry="5" fill="none" stroke="#94A3B8" stroke-width="1" />
    
    <text x="16" y="78" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Input Brain CT</text>
    <text x="16" y="96" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Non-Contrast DICOM/PNG</text>

    <!-- Specs Pills -->
    <rect x="16" y="116" width="128" height="24" rx="6" fill="#1E293B" />
    <text x="80" y="132" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="600">224 × 224 × 1</text>

    <rect x="16" y="148" width="128" height="24" rx="6" fill="#1E293B" />
    <text x="80" y="164" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600">Brain Window [0-80 HU]</text>

    <rect x="16" y="180" width="128" height="24" rx="6" fill="#1E293B" />
    <text x="80" y="196" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="10" font-weight="600">Norm (μ:0.18, σ:0.31)</text>

    <g transform="translate(16, 218)">
      <rect width="128" height="32" rx="6" fill="#064E3B" stroke="#047857" stroke-width="0.8" />
      <circle cx="16" cy="16" r="3.5" fill="#34D399" />
      <text x="26" y="20" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">HEURISTIC GUARD</text>
    </g>
  </g>

  <!-- CONNECTING FLOWS -->
  <path d="M 200 230 L 240 230 L 240 125 L 260 125" fill="none" stroke="#0284C7" stroke-width="1.5" class="flow-path" />
  <path d="M 200 230 L 240 230 L 240 195 L 260 195" fill="none" stroke="#0D9488" stroke-width="1.5" class="flow-path" />
  <path d="M 200 230 L 240 230 L 240 265 L 260 265" fill="none" stroke="#6366F1" stroke-width="1.5" class="flow-path" />
  <path d="M 200 230 L 240 230 L 240 335 L 260 335" fill="none" stroke="#F59E0B" stroke-width="1.5" class="flow-path" />

  <!-- 4 MODEL CARDS (Column 2) -->
  
  <!-- MODEL 1: VCA-NET -->
  <g transform="translate(260, 95)" filter="url(#glow-vca)">
    <rect width="285" height="60" rx="10" fill="url(#card-vca)" stroke="#0284C7" stroke-width="1.4" />
    <circle cx="28" cy="30" r="14" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" />
    <text x="28" y="34" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="800">01</text>
    <text x="52" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">VCA-Net Architecture</text>
    <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10.5">Visual Cortex Anatomy · PyTorch 2.5</text>
    <rect x="220" y="20" width="55" height="20" rx="4" fill="#0284C7" fill-opacity="0.2" />
    <text x="247.5" y="34" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="700">SEG (DSC: 0.81)</text>
  </g>

  <!-- MODEL 2: D-LKA NET -->
  <g transform="translate(260, 165)" filter="url(#glow-dlka)">
    <rect width="285" height="60" rx="10" fill="url(#card-dlka)" stroke="#0D9488" stroke-width="1.4" />
    <circle cx="28" cy="30" r="14" fill="#0F766E" fill-opacity="0.3" stroke="#2DD4BF" stroke-width="1" />
    <text x="28" y="34" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="11" font-weight="800">02</text>
    <text x="52" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">D-LKA Net (MaxViT + LKA)</text>
    <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10.5">Deformable Large Kernel Attention</text>
    <rect x="220" y="20" width="55" height="20" rx="4" fill="#0D9488" fill-opacity="0.2" />
    <text x="247.5" y="34" text-anchor="middle" fill="#2DD4BF" font-family="sans-serif" font-size="9" font-weight="700">SEG (DSC: 0.88)</text>
  </g>

  <!-- MODEL 3: PATCHER -->
  <g transform="translate(260, 235)" filter="url(#glow-patcher)">
    <rect width="285" height="60" rx="10" fill="url(#card-patcher)" stroke="#6366F1" stroke-width="1.4" />
    <circle cx="28" cy="30" r="14" fill="#4338CA" fill-opacity="0.3" stroke="#818CF8" stroke-width="1" />
    <text x="28" y="34" text-anchor="middle" fill="#818CF8" font-family="monospace" font-size="11" font-weight="800">03</text>
    <text x="52" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Patcher SegFormer</text>
    <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10.5">Patch Transformer + MoE Decoder</text>
    <rect x="215" y="20" width="60" height="20" rx="4" fill="#6366F1" fill-opacity="0.2" />
    <text x="245" y="34" text-anchor="middle" fill="#A5B4FC" font-family="sans-serif" font-size="9" font-weight="700">MMCV SERVICE</text>
  </g>

  <!-- MODEL 4: MAXVIT CLASSIFIER -->
  <g transform="translate(260, 305)" filter="url(#glow-maxvit)">
    <rect width="285" height="65" rx="10" fill="url(#card-maxvit)" stroke="#D97706" stroke-width="1.4" />
    <circle cx="28" cy="32" r="14" fill="#78350F" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1" />
    <text x="28" y="36" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="800">04</text>
    <text x="52" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">MaxViT Disease Classifier</text>
    <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10.5">3-Class Stroke Head (Acc: 82.85%)</text>
    <text x="52" y="58" fill="#F59E0B" font-family="sans-serif" font-size="9.5" font-weight="600">Normal · Hemorrhagic · Ischemic</text>
    <rect x="215" y="20" width="60" height="20" rx="4" fill="#D97706" fill-opacity="0.2" />
    <text x="245" y="34" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="700">3-CLASS</text>
  </g>

  <!-- FLOW TO HARMONIZATION ENGINE -->
  <path d="M 545 125 L 600 125 L 600 230 L 630 230" fill="none" stroke="#0284C7" stroke-width="1.5" class="flow-path" />
  <path d="M 545 195 L 630 230" fill="none" stroke="#0D9488" stroke-width="1.5" class="flow-path" />
  <path d="M 545 265 L 600 265 L 600 230 L 630 230" fill="none" stroke="#6366F1" stroke-width="1.5" class="flow-path" />
  <path d="M 545 335 L 600 335 L 600 230 L 630 230" fill="none" stroke="#F59E0B" stroke-width="1.5" class="flow-path" />

  <!-- HARMONIZATION & INFERENCE POST-PROCESS (Column 3) -->
  <g transform="translate(630, 95)">
    <rect width="240" height="275" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2" filter="url(#shadow-card)" />
    
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#1E293B" />
    <path d="M 24 26 L 44 26 L 37 36 L 37 43 L 31 40 L 31 36 Z" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-linejoin="round" />

    <text x="60" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Clinical Harmonization</text>
    <text x="60" y="45" fill="#64748B" font-family="sans-serif" font-size="10.5">Segmentation &amp; Attenuation</text>

    <!-- Harmonization Features -->
    <g transform="translate(14, 64)">
      <rect width="212" height="42" rx="6" fill="#1E293B" />
      <text x="10" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10.5" font-weight="600">CT Density Differentiation</text>
      <text x="10" y="32" fill="#94A3B8" font-family="sans-serif" font-size="9.5">Hyperdense &gt;+8 HU vs Hypodense &lt;-8 HU</text>
    </g>
    <g transform="translate(14, 114)">
      <rect width="212" height="42" rx="6" fill="#1E293B" />
      <text x="10" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10.5" font-weight="600">Noise Speck Suppression</text>
      <text x="10" y="32" fill="#94A3B8" font-family="sans-serif" font-size="9.5">Removes micro-artifacts &lt; 15 pixels</text>
    </g>
    <g transform="translate(14, 164)">
      <rect width="212" height="42" rx="6" fill="#1E293B" />
      <text x="10" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10.5" font-weight="600">Live Grayscale Stream</text>
      <text x="10" y="32" fill="#94A3B8" font-family="sans-serif" font-size="9.5">8-bit continuous probability PNG</text>
    </g>
    <g transform="translate(14, 214)">
      <rect width="212" height="46" rx="6" fill="#1E293B" />
      <text x="10" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10.5" font-weight="600">Dynamic Decision Slider</text>
      <text x="10" y="34" fill="#38BDF8" font-family="sans-serif" font-size="9.5" font-weight="600">0% – 100% threshold on Canvas</text>
    </g>
  </g>

  <!-- FLOW TO OUTPUT -->
  <path d="M 870 230 L 910 230" fill="none" stroke="#10B981" stroke-width="2" class="flow-path" />

  <!-- FINAL OUTPUT & MULTI-COLOR MASK (Column 4) -->
  <g transform="translate(910, 95)">
    <rect width="250" height="275" rx="12" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" filter="url(#shadow-card)" />

    <rect x="16" y="16" width="36" height="36" rx="8" fill="#064E3B" />
    <path d="M 26 34 L 32 40 L 42 28" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <text x="60" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Diagnostic Delivery</text>
    <text x="60" y="45" fill="#34D399" font-family="sans-serif" font-size="10.5">Dual-Color Clinical Overlay</text>

    <!-- Mask Color Legend -->
    <g transform="translate(14, 64)">
      <!-- Hemorrhagic Red -->
      <rect width="222" height="34" rx="6" fill="#1F1315" stroke="#EF4444" stroke-width="0.8" />
      <circle cx="16" cy="17" r="5" fill="#EF4444" />
      <text x="28" y="21" fill="#FCA5A5" font-family="sans-serif" font-size="10.5" font-weight="700">Hemorrhagic: Crimson Red</text>

      <!-- Ischemic Yellow -->
      <g transform="translate(0, 42)">
        <rect width="222" height="34" rx="6" fill="#1F1C10" stroke="#F59E0B" stroke-width="0.8" />
        <circle cx="16" cy="17" r="5" fill="#F59E0B" />
        <text x="28" y="21" fill="#FDE68A" font-family="sans-serif" font-size="10.5" font-weight="700">Ischemic: Amber / Yellow</text>
      </g>
    </g>

    <!-- Summary Box -->
    <g transform="translate(14, 150)">
      <rect width="222" height="110" rx="6" fill="#0B1D19" stroke="#047857" stroke-width="0.8" />
      <text x="12" y="22" fill="#94A3B8" font-family="sans-serif" font-size="10">Classification:</text>
      <text x="210" y="22" text-anchor="end" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="700">Hemorrhagic / Ischemic / Normal</text>
      <line x1="12" y1="30" x2="210" y2="30" stroke="#134E4A" stroke-width="0.8" />
      <text x="12" y="48" fill="#94A3B8" font-family="sans-serif" font-size="10">Lesion Area Ratio:</text>
      <text x="210" y="48" text-anchor="end" fill="#F8FAFC" font-family="monospace" font-size="10" font-weight="700">Quantified % Area</text>
      <line x1="12" y1="56" x2="210" y2="56" stroke="#134E4A" stroke-width="0.8" />
      <text x="12" y="74" fill="#94A3B8" font-family="sans-serif" font-size="10">Inspection:</text>
      <text x="210" y="74" text-anchor="end" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700">2.5×–8.0× Loupe &amp; Dual View</text>
      <line x1="12" y1="82" x2="210" y2="82" stroke="#134E4A" stroke-width="0.8" />
      <text x="12" y="100" fill="#94A3B8" font-family="sans-serif" font-size="10">Export:</text>
      <text x="210" y="100" text-anchor="end" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700">Medical Composite Frame</text>
    </g>
  </g>
</svg>
