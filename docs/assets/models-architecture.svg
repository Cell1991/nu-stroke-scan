<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="100%" height="100%">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="bg-grad-models" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#090E1B" />
    </linearGradient>

    <linearGradient id="card-vca" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1E38" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <linearGradient id="card-dlka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09282D" />
      <stop offset="100%" stop-color="#07191E" />
    </linearGradient>

    <linearGradient id="card-patcher" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1838" />
      <stop offset="100%" stop-color="#100F26" />
    </linearGradient>

    <linearGradient id="card-maxvit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1A10" />
      <stop offset="100%" stop-color="#1A0F0A" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-vca">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
    <filter id="glow-dlka">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2DD4BF" flood-opacity="0.3" />
    </filter>
    <filter id="glow-patcher">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#818CF8" flood-opacity="0.3" />
    </filter>
    <filter id="glow-maxvit">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>

    <style>
      @keyframes dashFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .flow-path {
        stroke-dasharray: 6 4;
        animation: dashFlow 1.8s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="1240" height="470" rx="16" fill="url(#bg-grad-models)" stroke="#1E293B" stroke-width="1.2" />

  <!-- SECTION HEADER -->
  <g transform="translate(40, 26)">
    <rect width="210" height="22" rx="11" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="0.8" />
    <text x="105" y="15" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">DEEP LEARNING SUITE</text>
    <text x="0" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3">
      Lesion Segmentation &amp; Multiclass Disease Classification Engine
    </text>
  </g>

  <!-- ==================== COLUMN 1: INPUT HUB ==================== -->
  <g transform="translate(40, 85)" filter="url(#shadow-card)">
    <rect width="195" height="355" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    
    <rect x="16" y="18" width="40" height="40" rx="8" fill="#1E293B" />
    <circle cx="36" cy="38" r="12" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <ellipse cx="36" cy="38" rx="8" ry="5" fill="none" stroke="#94A3B8" stroke-width="1" />
    
    <text x="16" y="80" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">Input Brain CT</text>
    <text x="16" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Non-Contrast DICOM/PNG</text>

    <!-- Specs Pills -->
    <rect x="16" y="118" width="163" height="28" rx="6" fill="#1E293B" />
    <text x="97.5" y="136" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10.5" font-weight="600">224 × 224 × 1</text>

    <rect x="16" y="156" width="163" height="28" rx="6" fill="#1E293B" />
    <text x="97.5" y="174" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="10.5" font-weight="600">Brain Window [0-80 HU]</text>

    <rect x="16" y="194" width="163" height="28" rx="6" fill="#1E293B" />
    <text x="97.5" y="212" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="10" font-weight="600">Norm (μ:0.18, σ:0.31)</text>

    <g transform="translate(16, 238)">
      <rect width="163" height="98" rx="8" fill="#064E3B" fill-opacity="0.25" stroke="#047857" stroke-width="0.8" />
      <circle cx="16" cy="18" r="4" fill="#34D399" />
      <text x="26" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700">HEURISTIC GUARD</text>
      <text x="14" y="44" fill="#94A3B8" font-family="sans-serif" font-size="9.5">• Single-Channel Grayscale</text>
      <text x="14" y="62" fill="#94A3B8" font-family="sans-serif" font-size="9.5">• Cranial Contour Aspect</text>
      <text x="14" y="80" fill="#94A3B8" font-family="sans-serif" font-size="9.5">• HU Intensity Sanity</text>
    </g>
  </g>

  <!-- CONNECTING FLOWS (Col 1 -> Col 2) -->
  <path d="M 235 260 L 275 260 L 275 125 L 290 125" fill="none" stroke="#0284C7" stroke-width="1.5" class="flow-path" />
  <path d="M 235 260 L 275 260 L 275 215 L 290 215" fill="none" stroke="#0D9488" stroke-width="1.5" class="flow-path" />
  <path d="M 235 260 L 275 260 L 275 305 L 290 305" fill="none" stroke="#6366F1" stroke-width="1.5" class="flow-path" />
  <path d="M 235 260 L 275 260 L 275 395 L 290 395" fill="none" stroke="#F59E0B" stroke-width="1.5" class="flow-path" />

  <!-- ==================== COLUMN 2: 4 AI MODELS ==================== -->
  <g transform="translate(290, 85)">
    <!-- MODEL 1: VCA-NET -->
    <g filter="url(#glow-vca)">
      <rect width="400" height="78" rx="10" fill="url(#card-vca)" stroke="#0284C7" stroke-width="1.4" />
      <circle cx="28" cy="39" r="14" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" />
      <text x="28" y="43" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="800">01</text>
      <text x="54" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="13.5" font-weight="700">VCA-Net Architecture</text>
      <text x="54" y="46" fill="#94A3B8" font-family="sans-serif" font-size="11">Visual Cortex Anatomy · PyTorch 2.5</text>
      <text x="54" y="64" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="600">Slice DSC: 0.8063 · Volume DSC: 0.7800</text>
      
      <rect x="305" y="16" width="82" height="22" rx="4" fill="#0284C7" fill-opacity="0.25" stroke="#0284C7" stroke-width="0.8" />
      <text x="346" y="31" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="700">SEGMENT</text>
    </g>

    <!-- MODEL 2: D-LKA NET -->
    <g transform="translate(0, 90)" filter="url(#glow-dlka)">
      <rect width="400" height="78" rx="10" fill="url(#card-dlka)" stroke="#0D9488" stroke-width="1.4" />
      <circle cx="28" cy="39" r="14" fill="#0F766E" fill-opacity="0.3" stroke="#2DD4BF" stroke-width="1" />
      <text x="28" y="43" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="11" font-weight="800">02</text>
      <text x="54" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="13.5" font-weight="700">D-LKA Net (MaxViT + LKA)</text>
      <text x="54" y="46" fill="#94A3B8" font-family="sans-serif" font-size="11">Deformable Large Kernel Attention</text>
      <text x="54" y="64" fill="#2DD4BF" font-family="sans-serif" font-size="10" font-weight="600">Slice DSC: 0.8758 (SOTA Lesion Overlap)</text>
      
      <rect x="305" y="16" width="82" height="22" rx="4" fill="#0D9488" fill-opacity="0.25" stroke="#0D9488" stroke-width="0.8" />
      <text x="346" y="31" text-anchor="middle" fill="#2DD4BF" font-family="sans-serif" font-size="9" font-weight="700">TOP DSC</text>
    </g>

    <!-- MODEL 3: PATCHER -->
    <g transform="translate(0, 180)" filter="url(#glow-patcher)">
      <rect width="400" height="78" rx="10" fill="url(#card-patcher)" stroke="#6366F1" stroke-width="1.4" />
      <circle cx="28" cy="39" r="14" fill="#4338CA" fill-opacity="0.3" stroke="#818CF8" stroke-width="1" />
      <text x="28" y="43" text-anchor="middle" fill="#818CF8" font-family="monospace" font-size="11" font-weight="800">03</text>
      <text x="54" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="13.5" font-weight="700">Patcher SegFormer</text>
      <text x="54" y="46" fill="#94A3B8" font-family="sans-serif" font-size="11">Patch Transformer + MoE Decoder</text>
      <text x="54" y="64" fill="#A5B4FC" font-family="sans-serif" font-size="10" font-weight="600">Isolated PyTorch 1.12 MMCV Container</text>
      
      <rect x="300" y="16" width="87" height="22" rx="4" fill="#6366F1" fill-opacity="0.25" stroke="#6366F1" stroke-width="0.8" />
      <text x="343.5" y="31" text-anchor="middle" fill="#A5B4FC" font-family="sans-serif" font-size="8.5" font-weight="700">MICROSERVICE</text>
    </g>

    <!-- MODEL 4: MAXVIT CLASSIFIER -->
    <g transform="translate(0, 270)" filter="url(#glow-maxvit)">
      <rect width="400" height="85" rx="10" fill="url(#card-maxvit)" stroke="#D97706" stroke-width="1.4" />
      <circle cx="28" cy="42" r="14" fill="#78350F" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1" />
      <text x="28" y="46" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="800">04</text>
      <text x="54" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13.5" font-weight="700">MaxViT Disease Classifier</text>
      <text x="54" y="44" fill="#94A3B8" font-family="sans-serif" font-size="11">3-Class Pretrained Head (Acc: 82.85%)</text>
      <text x="54" y="62" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="600">Macro-F1: 76.35% · Normal / Hem. / Isch.</text>
      
      <rect x="305" y="16" width="82" height="22" rx="4" fill="#D97706" fill-opacity="0.25" stroke="#D97706" stroke-width="0.8" />
      <text x="346" y="31" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="700">3-CLASS</text>
    </g>
  </g>

  <!-- CONNECTING FLOWS (Col 2 -> Col 3) -->
  <path d="M 690 124 L 720 124 L 720 260 L 730 260" fill="none" stroke="#0284C7" stroke-width="1.5" class="flow-path" />
  <path d="M 690 214 L 730 260" fill="none" stroke="#0D9488" stroke-width="1.5" class="flow-path" />
  <path d="M 690 304 L 720 304 L 720 260 L 730 260" fill="none" stroke="#6366F1" stroke-width="1.5" class="flow-path" />
  <path d="M 690 395 L 720 395 L 720 260 L 730 260" fill="none" stroke="#F59E0B" stroke-width="1.5" class="flow-path" />

  <!-- ==================== COLUMN 3: CLINICAL DECISION & ATTENUATION ==================== -->
  <g transform="translate(730, 85)">
    <!-- TOP SUB-CARD: HARMONIZATION & INFERENCE ENGINE -->
    <g filter="url(#shadow-card)">
      <rect width="470" height="145" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      
      <rect x="16" y="14" width="32" height="32" rx="6" fill="#1E293B" />
      <path d="M 23 23 L 41 23 L 35 32 L 35 38 L 29 35 L 29 32 Z" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-linejoin="round" />

      <text x="56" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Clinical Attenuation Harmonization</text>
      <text x="56" y="42" fill="#64748B" font-family="sans-serif" font-size="10.5">Radiologic Density &amp; Artifact Filtering</text>

      <g transform="translate(16, 56)">
        <rect width="210" height="38" rx="6" fill="#1E293B" />
        <text x="10" y="16" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">CT Density Differentiation</text>
        <text x="10" y="30" fill="#94A3B8" font-family="sans-serif" font-size="9">Hyperdense &gt;+8 HU vs Hypodense &lt;-8 HU</text>

        <rect x="226" width="212" height="38" rx="6" fill="#1E293B" />
        <text x="236" y="16" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Noise Speck Suppression</text>
        <text x="236" y="30" fill="#94A3B8" font-family="sans-serif" font-size="9">Removes artifacts &lt; 15 pixels</text>

        <rect y="46" width="438" height="34" rx="6" fill="#1E293B" />
        <text x="10" y="67" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="600">Live Grayscale Probability Stream · 0% – 100% Dynamic Canvas Thresholding</text>
      </g>
    </g>

    <!-- BOTTOM SUB-CARD: DUAL-COLOR DIAGNOSTIC DELIVERY -->
    <g transform="translate(0, 160)" filter="url(#shadow-card)">
      <rect width="470" height="195" rx="12" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />

      <!-- Top Mask Color Badges Side-by-Side -->
      <g transform="translate(16, 14)">
        <!-- Hemorrhagic Red -->
        <rect width="210" height="32" rx="6" fill="#1F1315" stroke="#EF4444" stroke-width="0.9" />
        <circle cx="16" cy="16" r="4.5" fill="#EF4444" />
        <text x="28" y="20" fill="#FCA5A5" font-family="sans-serif" font-size="10.5" font-weight="700">Hemorrhagic: Crimson Red</text>

        <!-- Ischemic Yellow -->
        <g transform="translate(226, 0)">
          <rect width="212" height="32" rx="6" fill="#1F1C10" stroke="#F59E0B" stroke-width="0.9" />
          <circle cx="16" cy="16" r="4.5" fill="#F59E0B" />
          <text x="28" y="20" fill="#FDE68A" font-family="sans-serif" font-size="10.5" font-weight="700">Ischemic: Amber / Yellow</text>
        </g>
      </g>

      <!-- Clean Separated Rows with Huge Width Clearance -->
      <g transform="translate(16, 56)">
        <rect width="438" height="125" rx="6" fill="#0B1D19" stroke="#047857" stroke-width="0.8" />
        
        <!-- Row 1 -->
        <text x="14" y="22" fill="#94A3B8" font-family="sans-serif" font-size="10.5">MaxViT Classification:</text>
        <text x="424" y="22" text-anchor="end" fill="#F59E0B" font-family="sans-serif" font-size="10.5" font-weight="700">Normal / Hemorrhagic / Ischemic</text>
        <line x1="14" y1="31" x2="424" y2="31" stroke="#134E4A" stroke-width="0.7" />

        <!-- Row 2 -->
        <text x="14" y="50" fill="#94A3B8" font-family="sans-serif" font-size="10.5">Lesion Area Ratio:</text>
        <text x="424" y="50" text-anchor="end" fill="#F8FAFC" font-family="monospace" font-size="10.5" font-weight="700">Quantified Surface % Area</text>
        <line x1="14" y1="59" x2="424" y2="59" stroke="#134E4A" stroke-width="0.7" />

        <!-- Row 3 -->
        <text x="14" y="78" fill="#94A3B8" font-family="sans-serif" font-size="10.5">Diagnostic Inspection:</text>
        <text x="424" y="78" text-anchor="end" fill="#38BDF8" font-family="sans-serif" font-size="10.5" font-weight="700">2.5×–8.0× Loupe &amp; Synced Dual View</text>
        <line x1="14" y1="87" x2="424" y2="87" stroke="#134E4A" stroke-width="0.7" />

        <!-- Row 4 -->
        <text x="14" y="106" fill="#94A3B8" font-family="sans-serif" font-size="10.5">Clinical Export:</text>
        <text x="424" y="106" text-anchor="end" fill="#34D399" font-family="sans-serif" font-size="10.5" font-weight="700">Medical Composite PACS Frame</text>
      </g>
    </g>
  </g>
</svg>
