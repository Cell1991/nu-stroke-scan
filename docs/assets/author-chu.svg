<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-chu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="avatar-grad-chu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="chu-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="chu-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.15" />
    </filter>

    <style>
      @keyframes glowChu {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      .card-chu-border {
        animation: glowChu 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="556" height="256" x="2" y="2" rx="16" fill="url(#card-bg-chu)" filter="url(#chu-shadow)" />
  <rect width="556" height="256" x="2" y="2" rx="16" fill="none" stroke="url(#chu-border)" stroke-width="1.5" class="card-chu-border" />

  <!-- Avatar Badge (Left) -->
  <g transform="translate(30, 32)">
    <rect width="76" height="76" rx="20" fill="url(#avatar-grad-chu)" />
    <!-- User Icon Vector -->
    <circle cx="38" cy="30" r="14" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M 18 64 C 18 50 26 44 38 44 C 50 44 58 50 58 64 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Active Status Beacon -->
    <circle cx="66" cy="12" r="6" fill="#10B981" stroke="#0F172A" stroke-width="2" />
  </g>

  <!-- Researcher Details (Right) -->
  <g transform="translate(126, 32)">
    <!-- Research Track Pill -->
    <rect width="180" height="22" rx="11" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="0.8" />
    <text x="90" y="15" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">CO-RESEARCHER &amp; LEAD UI</text>

    <!-- Name -->
    <text x="0" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">
      Chu (@Cell1991)
    </text>

    <!-- Role / Specialty -->
    <text x="0" y="74" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">
      Senior Researcher · UI/UX &amp; System Architect
    </text>

    <!-- Focus Description -->
    <text x="0" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="400">
      Interactive Dual Viewport · 2.5× Loupe · Fast Clinical Next.js
    </text>

    <!-- Skill Tags -->
    <g transform="translate(0, 116)">
      <rect width="82" height="22" rx="6" fill="#1E293B" />
      <text x="41" y="15" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="10" font-weight="600">Next.js 15</text>

      <rect x="88" width="80" height="22" rx="6" fill="#1E293B" />
      <text x="128" y="15" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="10" font-weight="600">FastAPI</text>

      <rect x="174" width="86" height="22" rx="6" fill="#1E293B" />
      <text x="217" y="15" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="10" font-weight="600">PostgreSQL</text>

      <rect x="266" width="65" height="22" rx="6" fill="#1E293B" />
      <text x="298" y="15" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="10" font-weight="600">Docker</text>
    </g>

    <!-- Contact & Links -->
    <g transform="translate(0, 160)">
      <circle cx="6" cy="6" r="3" fill="#38BDF8" />
      <text x="15" y="10" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">
        celleb1991@gmail.com
      </text>

      <circle cx="190" cy="6" r="3" fill="#10B981" />
      <text x="199" y="10" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">
        github.com/Cell1991
      </text>
    </g>
  </g>
</svg>
