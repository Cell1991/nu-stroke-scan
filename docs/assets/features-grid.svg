<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0A1227" />
      <stop offset="100%" stop-color="#070C18" />
    </linearGradient>

    <linearGradient id="feat-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1B33" />
      <stop offset="100%" stop-color="#091224" />
    </linearGradient>

    <!-- Filters -->
    <filter id="feat-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes glowFeature {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      .card-glow-1 { animation: glowFeature 3.2s ease-in-out infinite; }
      .card-glow-2 { animation: glowFeature 3.2s ease-in-out 0.8s infinite; }
      .card-glow-3 { animation: glowFeature 3.2s ease-in-out 1.6s infinite; }
      .card-glow-4 { animation: glowFeature 3.2s ease-in-out 2.4s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="370" rx="16" fill="url(#bg-grad-feat)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Section Title -->
  <g transform="translate(45, 30)">
    <rect width="200" height="22" rx="11" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="0.8" />
    <text x="100" y="15" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CLINICAL WORKSPACE</text>
    <text x="0" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3">
      Advanced Neuro-Radiology Toolset &amp; Diagnostic UI
    </text>
  </g>

  <!-- 4 FEATURE CARDS (2x2 Grid) -->

  <!-- CARD 1: DIAGNOSTIC LOUPE (Top Left) -->
  <g transform="translate(45, 88)" filter="url(#feat-shadow)">
    <rect width="535" height="118" rx="12" fill="url(#feat-card-bg)" stroke="#0284C7" stroke-width="1.2" class="card-glow-1" />
    
    <!-- Icon -->
    <rect x="18" y="18" width="46" height="46" rx="10" fill="#0369A1" fill-opacity="0.3" stroke="#0284C7" stroke-width="0.8" />
    <circle cx="41" cy="41" r="10" fill="none" stroke="#38BDF8" stroke-width="2" />
    <line x1="48" y1="48" x2="56" y2="56" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <text x="41" y="44" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="800">+</text>

    <!-- Content -->
    <text x="76" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">
      2.5× to 8.0× Real-Time Diagnostic Loupe
    </text>
    <text x="76" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      Right-click activation with vertical drag zoom (1.2× – 8.0×).
    </text>
    <text x="76" y="76" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">
      Enables sub-millimeter inspection of ischemic borders.
    </text>

    <!-- Tag -->
    <rect x="445" y="16" width="74" height="20" rx="4" fill="#0284C7" fill-opacity="0.2" />
    <text x="482" y="30" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="700">LOUPE 8X</text>
  </g>

  <!-- CARD 2: DUAL-PANE VIEWPORT (Top Right) -->
  <g transform="translate(620, 88)" filter="url(#feat-shadow)">
    <rect width="535" height="118" rx="12" fill="url(#feat-card-bg)" stroke="#0D9488" stroke-width="1.2" class="card-glow-2" />
    
    <!-- Icon -->
    <rect x="18" y="18" width="46" height="46" rx="10" fill="#0F766E" fill-opacity="0.3" stroke="#0D9488" stroke-width="0.8" />
    <rect x="28" y="28" width="11" height="26" rx="2" fill="none" stroke="#2DD4BF" stroke-width="1.5" />
    <rect x="43" y="28" width="11" height="26" rx="2" fill="none" stroke="#2DD4BF" stroke-width="1.5" />

    <!-- Content -->
    <text x="76" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">
      1:1 Synchronized Dual-Pane Viewport
    </text>
    <text x="76" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      Side-by-side comparative display of Raw CT vs. AI Mask.
    </text>
    <text x="76" y="76" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">
      Synchronized 0.5× – 4.0× Pan &amp; Zoom with anatomical grid.
    </text>

    <!-- Tag -->
    <rect x="445" y="16" width="74" height="20" rx="4" fill="#0D9488" fill-opacity="0.2" />
    <text x="482" y="30" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="9" font-weight="700">SYNC PAN</text>
  </g>

  <!-- CARD 3: DUAL COLOR MASK & HARMONIZATION (Bottom Left) -->
  <g transform="translate(45, 222)" filter="url(#feat-shadow)">
    <rect width="535" height="118" rx="12" fill="url(#feat-card-bg)" stroke="#EF4444" stroke-width="1.2" class="card-glow-3" />
    
    <!-- Icon -->
    <rect x="18" y="18" width="46" height="46" rx="10" fill="#450A0A" fill-opacity="0.4" stroke="#EF4444" stroke-width="0.8" />
    <circle cx="36" cy="41" r="7" fill="#EF4444" />
    <circle cx="48" cy="38" r="6" fill="#F59E0B" />

    <!-- Content -->
    <text x="76" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">
      Dual-Color Lesion Mask &amp; CT Density
    </text>
    <text x="76" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      Red mask for Hemorrhagic; Yellow for Ischemic stroke.
    </text>
    <text x="76" y="76" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">
      Harmonized with CT density and MaxViT classification.
    </text>

    <!-- Tag -->
    <rect x="430" y="16" width="89" height="20" rx="4" fill="#EF4444" fill-opacity="0.2" />
    <text x="474" y="30" text-anchor="middle" fill="#FCA5A5" font-family="monospace" font-size="9" font-weight="700">DUAL-COLOR</text>
  </g>

  <!-- CARD 4: MEDICAL COMPOSITE EXPORT & TACTILE CONTROLS (Bottom Right) -->
  <g transform="translate(620, 222)" filter="url(#feat-shadow)">
    <rect width="535" height="118" rx="12" fill="url(#feat-card-bg)" stroke="#10B981" stroke-width="1.2" class="card-glow-4" />
    
    <!-- Icon -->
    <rect x="18" y="18" width="46" height="46" rx="10" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="0.8" />
    <rect x="28" y="28" width="26" height="26" rx="4" fill="none" stroke="#34D399" stroke-width="1.5" />
    <line x1="33" y1="41" x2="49" y2="41" stroke="#34D399" stroke-width="1.5" />
    <line x1="41" y1="33" x2="41" y2="49" stroke="#34D399" stroke-width="1.5" />

    <!-- Content -->
    <text x="76" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700">
      Medical Composite Export &amp; Windowing
    </text>
    <text x="76" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      Bakes active windowing, threshold, opacity, &amp; metadata.
    </text>
    <text x="76" y="76" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">
      Instant client-side canvas re-rendering without API latency.
    </text>

    <!-- Tag -->
    <rect x="430" y="16" width="89" height="20" rx="4" fill="#10B981" fill-opacity="0.2" />
    <text x="474" y="30" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="9" font-weight="700">COMPOSITE</text>
  </g>
</svg>
