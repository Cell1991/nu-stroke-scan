services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@database:5432/nu_stroke_scan}
      VCANET_CHECKPOINT: ${VCANET_CHECKPOINT:-/model-weights/vcanet_best.pth}
      DLKA_CHECKPOINT: ${DLKA_CHECKPOINT:-/model-weights/dlka_best.pth}
      PATCHER_SERVICE_URL: ${PATCHER_SERVICE_URL:-http://patcher:8001}
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.5}
      PYTHONPATH: /model-src/vcanet_ct:/model-src/dlka_ct_2d
    volumes:
      - ./backend:/app
      - ../results/vcanet_results/checkpoints/best.pth:/model-weights/vcanet_best.pth:ro
      - ../results/dlka_results/checkpoints/best.pth:/model-weights/dlka_best.pth:ro
      - ../vcanet_ct/model.py:/model-src/vcanet_ct/model.py:ro
      - ../vcanet_ct/custom_layers.py:/model-src/vcanet_ct/custom_layers.py:ro
      - ../dlka_ct/2D/networks:/model-src/dlka_ct_2d/networks:ro
      - ../dlka_ct/2D/deformable_LKA:/model-src/dlka_ct_2d/deformable_LKA:ro
    depends_on:
      database:
        condition: service_healthy
      patcher:
        condition: service_started

  patcher:
    build:
      context: ../patcher_ct
    environment:
      PATCHER_CHECKPOINT: ${PATCHER_CHECKPOINT:-/model-weights/patcher_best.ckpt}
    volumes:
      - ../results/patcher_results_new/checkpoints/best.ckpt:/model-weights/patcher_best.ckpt:ro

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nu_stroke_scan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
