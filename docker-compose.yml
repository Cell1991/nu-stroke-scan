services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@database:5432/nu_stroke_scan}
      VCANET_CHECKPOINT: ${VCANET_CHECKPOINT:-/checkpoints/vcanet_best.pth}
      DLKA_CHECKPOINT: ${DLKA_CHECKPOINT:-/checkpoints/dlka_best.pth}
      PATCHER_CHECKPOINT: ${PATCHER_CHECKPOINT:-/checkpoints/patcher_best.ckpt}
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.5}
    volumes:
      - ./backend:/app
      - ./checkpoints:/checkpoints:ro
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nu_stroke_scan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
